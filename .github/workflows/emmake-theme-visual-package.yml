name: Emmake Corporate v5 Visual Theme Package

on:
  pull_request:
    paths:
      - 'packages/seo-geo-theme/style.css'
      - 'packages/seo-geo-theme/assets/css/presets/corporate-v5-a3-1.css'
      - 'packages/seo-geo-theme/assets/css/presets/corporate-inner-v1.css'
      - 'packages/seo-geo-theme/functions.php'
      - 'scripts/build-theme-package.sh'
      - '.github/workflows/emmake-theme-visual-package.yml'
      - 'docs/EMMAKE_A3_2_VISUAL_ACCEPTANCE.md'
      - 'docs/EMMAKE_A3_3_LAYOUT_ACCEPTANCE.md'
      - 'docs/EMMAKE_A3_4_METHOD_CARD_ACCEPTANCE.md'
      - 'docs/EMMAKE_INNER_SURFACES_V1.md'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble standalone WordPress Theme, no new plugin
        run: bash scripts/build-theme-package.sh dist/seo-geo-theme
      - name: Verify contrast selectors are in client bundle and governed version is 0.1.1
        run: |
          set -euo pipefail
          css='dist/seo-geo-theme/assets/css/presets/corporate-v5-runtime.css'
          grep -Fq 'Version: 0.1.1' dist/seo-geo-theme/style.css
          grep -Fq 'Emmake A3.2 contrast + mobile first-screen acceptance' "$css"
          grep -Fq 'color: #f7fffc !important;' "$css"
          grep -Fq 'background: #0d3940 !important;' "$css"
          grep -Fq 'font-size: clamp(2rem, 8.2vw, 2.65rem) !important;' "$css"
          grep -Fq 'Emmake A3.3 layout gutters: full-bleed Hero and breathing room in Method' "$css"
          grep -Fq 'inline-size: 100vw !important;' "$css"
          grep -Fq 'margin-inline: calc(50% - 50vw) !important;' "$css"
          grep -Fq 'padding-inline: clamp(1.5rem, 5vw, 5rem);' "$css"
          grep -Fq 'padding-inline: clamp(1.25rem, 5.5vw, 1.5rem);' "$css"
          grep -Fq 'Emmake A3.4 Method card interior' "$css"
          grep -Fq 'padding-inline: clamp(1.75rem, 2.6vw, 2.7rem) !important;' "$css"
          grep -Fq 'padding-inline: clamp(1.5rem, 4vw, 2.25rem) !important;' "$css"
          grep -Fq 'padding-inline: 1.5rem !important;' "$css"
          grep -Fq 'margin-block: 0 1.1rem;' "$css"
          grep -Fq 'css-bundle-v3-a3-1' dist/seo-geo-theme/assets/css/presets/corporate-v5-bundled.marker
          test -f dist/seo-geo-theme/inc/seo-geo-core/src/Runtime.php
          test -f dist/seo-geo-theme/strategic-templates/corporate-home.php
          test -f dist/seo-geo-theme/functions.php
          inner='dist/seo-geo-theme/assets/css/presets/corporate-inner-v1.css'
          test -s "$inner"
          grep -Fq 'Corporate inner surfaces v1' "$inner"
          grep -Fq '.seo-geo-insights-shell' "$inner"
          grep -Fq '.seo-geo-inner-service-grid' "$inner"
          grep -Fq '.seo-geo-site-header' "$inner"
          grep -Fq "seo-geo-theme-preset-corporate-inner" dist/seo-geo-theme/functions.php
      - name: Build official deterministic release with integrity manifest
        run: |
          set -euo pipefail
          python3 scripts/ci/release-version-acceptance.py
          python3 scripts/build-theme-release.py --output dist/seo-geo-theme-0.1.1-emmake-inner-v1.zip
          unzip -t dist/seo-geo-theme-0.1.1-emmake-inner-v1.zip | tail -n 2
          unzip -p dist/seo-geo-theme-0.1.1-emmake-inner-v1.zip seo-geo-theme/assets/css/presets/corporate-v5-runtime.css | grep -Fq 'Emmake A3.2 contrast + mobile first-screen acceptance'
      - name: Upload standalone Theme 0.1.1 inner pages v1
        uses: actions/upload-artifact@v4
        with:
          name: seo-geo-theme-0.1.1-emmake-inner-v1
          path: |
            dist/seo-geo-theme-0.1.1-emmake-inner-v1.zip
            dist/seo-geo-theme-0.1.1-emmake-inner-v1.zip.sha256
          retention-days: 14
