name: Corporate Page 0.8.58 Release Sync

on:
  push:
    branches:
      - feat/corporate-inner-page-content-pipeline

permissions:
  contents: write

concurrency:
  group: corporate-page-058-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/corporate-inner-page-content-pipeline

      - name: Synchronize 0.8.58 release contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Strict version-bound field-pilot acceptance.
          path = Path('scripts/ci/emmake-field-pilot-pack-acceptance.py')
          text = path.read_text()
          text = text.replace('manifest["migration_bridge"]["version"] != "0.8.57"', 'manifest["migration_bridge"]["version"] != "0.8.58"')
          text = text.replace('Pilot pack must carry Migration Bridge 0.8.57', 'Pilot pack must carry Migration Bridge 0.8.58')
          path.write_text(text)

          # Field runbook carries the current installable candidate.
          path = Path('docs/EMMAKE_HOME_FIELD_PILOT.md')
          text = path.read_text().replace('Migration Bridge 0.8.57.', 'Migration Bridge 0.8.58.')
          path.write_text(text)

          # Release documentation: current version + pack + new release section.
          path = Path('docs/MIGRATION_BRIDGE_RELEASE.md')
          text = path.read_text()
          text = text.replace('current plugin version: `0.8.57`;', 'current plugin version: `0.8.58`;')
          text = text.replace('- Migration Bridge 0.8.57;\n- `examples/content-blueprints/emmake-home.es_ES.json`;', '- Migration Bridge 0.8.58;\n- `examples/content-blueprints/emmake-home.es_ES.json`;')
          marker = '## Version 0.8.57 — Clean Corporate inner-page rebuild\n'
          section = '''## Version 0.8.58 — Complete Corporate page pipeline + whole-site readiness\n\n0.8.58 closes product development before real-site browser testing.\n\n1. Services, Work, About and Contact share one reusable reset-first pipeline: rescued-source binding → portable Content Blueprint / Content Kit → native hydration → provider-neutral SEO/GEO handoff → deterministic readiness;\n2. Work requires explicitly verified case-study evidence before it can be considered ready;\n3. About requires real author/provenance content and Contact requires at least one real direct contact method;\n4. optional proof and FAQ sections are omitted unless reviewed content/verification exists;\n5. Insights is implemented separately as a native dynamic WordPress posts index using the rescued public page as `page_for_posts`, Theme `home.html` Query Loop rendering and provider-neutral SEO metadata;\n6. Insights assignment and native metadata are reversible and legacy page-builder content is not rendered by the posts index;\n7. `CorporateSiteReadiness` requires Home + Services + Work + About + Contact + Insights to be machine-ready together;\n8. the whole-site gate rejects duplicate source/path bindings, front/posts authority conflicts, placeholder links and unsafe links;\n9. operator screens exist for static page pipeline, Insights and final site readiness;\n10. browser QA remains a separate phase and no automatic production cutover exists.\n\nThis release candidate is the development freeze point before the complete `/nuevaweb/` field test.\n\n'''
          if marker not in text:
              raise SystemExit('Migration Bridge release marker missing')
          if '## Version 0.8.58 — Complete Corporate page pipeline + whole-site readiness' not in text:
              text = text.replace(marker, section + marker)
          path.write_text(text)

          # Product README: current capability first, historical 0.8.57 retained below.
          path = Path('packages/seo-geo-migration-bridge/README.md')
          text = path.read_text()
          marker = '## Clean Corporate inner-page rebuild — 0.8.57\n'
          section = '''## Complete Corporate page pipeline + whole-site readiness — 0.8.58\n\n0.8.58 is the development-complete candidate before full real-site testing.\n\n- Services, Work, About and Contact use one reusable clean-page pipeline from rescued source identity through semantic Blueprint/Content Kit, native hydration, SEO/GEO handoff and readiness;\n- evidence-sensitive Work/proof content cannot become ready without explicit verification;\n- Contact requires a real direct contact method and About requires real provenance/author content;\n- Insights uses the rescued public URL as a native dynamic WordPress posts index instead of a static hydrated page;\n- the final whole-site gate requires Home, all four static inner pages and Insights to be ready together and rejects duplicate bindings/paths and unsafe placeholder links;\n- browser QA and production cutover remain explicit later phases.\n\n'''
          if marker not in text:
              raise SystemExit('README 0.8.57 marker missing')
          if '## Complete Corporate page pipeline + whole-site readiness — 0.8.58' not in text:
              text = text.replace(marker, section + marker)
          path.write_text(text)

          # Changelog records the new candidate while keeping previous releases historical.
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## [Unreleased] — target 0.1.0\n\n'
          bullet = '- Migration Bridge 0.8.58 completes the **Corporate reset-first page pipeline and whole-site readiness**: reusable Services/Work/About/Contact Blueprint→hydration→SEO→readiness flow, evidence/provenance/contact safety gates, native dynamic Insights index, reversible assignment, and a final machine gate across Home + all inner surfaces before browser QA.\n\n'
          if marker not in text:
              raise SystemExit('Changelog marker missing')
          if bullet not in text:
              text = text.replace(marker, marker + bullet)
          path.write_text(text)

          # Roadmap: close 10E.4E.2, advance to the complete product candidate.
          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          text = text.replace(
              'Status: **active — 10E.4E.1 / Migration Bridge 0.8.57 candidate**',
              'Status: **active — 10E.4E.3 / Migration Bridge 0.8.58 candidate**'
          )
          text = text.replace(
              '#### 10E.4E.2 — Services semantic content contract\n\nStatus: **active — current development pointer**',
              '#### 10E.4E.2 — Services semantic content contract\n\nStatus: **accepted — PR #231 / 11 of 11 CI gates green / merge `6d4f816e2ec47fee2251ef04cb74ae919339b788`**'
          )
          final_marker = '#### 10E.4E.final — Clean-site acceptance\n'
          section = '''#### 10E.4E.3 — Complete Corporate page pipeline + Insights + whole-site readiness\n\nStatus: **active — PR #232 / Migration Bridge 0.8.58 candidate / current development pointer**\n\nGoal:\n\nFinish the reusable product before any real `/nuevaweb/` browser testing, so the pilot validates the complete architecture rather than an incomplete Home-only path.\n\nCandidate behavior:\n\n- Services, Work, About and Contact share one generic Blueprint/Content Kit → native hydration → SEO/GEO handoff → readiness runtime;\n- page/source binding remains explicit, immutable and URL-preserving;\n- Work requires a verified case-study group;\n- About requires real identity/provenance content;\n- Contact requires at least one reviewed direct contact method;\n- proof/FAQ sections are omitted rather than filled with invented evidence or filler;\n- Insights is a native dynamic WordPress posts index using the rescued page as `page_for_posts`;\n- Theme `home.html` owns dynamic Query Loop rendering and does not render legacy builder content;\n- Insights assignment/native metadata are reversible;\n- final `CorporateSiteReadiness` requires Home + Services + Work + About + Contact + Insights ready together;\n- duplicate source/path bindings, front/posts authority conflicts, placeholder `href="#"` and unsafe links block global readiness;\n- operator surfaces exist for page pipeline, Insights and whole-site readiness;\n- no automatic production cutover.\n\nAcceptance target:\n\n- WPCS + PHPStan level 6 green;\n- dedicated Corporate Page Pipeline CI green;\n- WordPress Smoke, Foundation, Theme, multilingual, accessibility/responsive, performance and release/package gates green;\n- deterministic Migration Bridge 0.8.58 and Emmake field pack artifacts.\n\nNext only after acceptance:\n\n- freeze functional development;\n- install the accepted Theme + Migration Bridge 0.8.58 candidate on `/nuevaweb/`;\n- execute the complete machine pipeline for all surfaces;\n- require global readiness green;\n- perform the full browser QA matrix page by page and whole-site;\n- production cutover remains a separate explicit decision.\n\n'''
          if final_marker not in text:
              raise SystemExit('Roadmap final marker missing')
          if '#### 10E.4E.3 — Complete Corporate page pipeline + Insights + whole-site readiness' not in text:
              text = text.replace(final_marker, section + final_marker)
          path.write_text(text)
          PY

      - name: Verify synchronized version references
        run: |
          grep -q 'Version: 0.8.58' packages/seo-geo-migration-bridge/seo-geo-migration-bridge.php
          grep -q "SEO_GEO_MIGRATION_BRIDGE_VERSION', '0.8.58'" packages/seo-geo-migration-bridge/seo-geo-migration-bridge.php
          grep -q 'Migration Bridge 0.8.58' docs/EMMAKE_HOME_FIELD_PILOT.md
          grep -q 'version"] != "0.8.58"' scripts/ci/emmake-field-pilot-pack-acceptance.py
          grep -q 'current plugin version: `0.8.58`' docs/MIGRATION_BRIDGE_RELEASE.md
          grep -q 'Complete Corporate page pipeline + whole-site readiness — 0.8.58' packages/seo-geo-migration-bridge/README.md

      - name: Commit synchronized release metadata
        run: |
          if git diff --quiet; then
            echo 'Release metadata already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/seo-geo-migration-bridge/README.md docs/MIGRATION_BRIDGE_RELEASE.md docs/EMMAKE_HOME_FIELD_PILOT.md scripts/ci/emmake-field-pilot-pack-acceptance.py CHANGELOG.md docs/ROADMAP.md
          git commit -m 'Document Migration Bridge 0.8.58 release candidate'
          git push origin HEAD:feat/corporate-inner-page-content-pipeline
