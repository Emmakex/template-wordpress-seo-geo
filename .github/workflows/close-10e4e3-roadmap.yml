name: Close 10E.4E.3 Roadmap

on:
  push:
    branches:
      - docs/close-10e4e3-testing-pointer

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-10e4e3-testing-pointer

      - name: Close development phase and advance testing pointer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text()

          text = text.replace(
              'Status: **active — 10E.4E.3 / Migration Bridge 0.8.58 candidate**',
              'Status: **active — 10E.4E.final / complete-site sandbox acceptance is the current execution pointer**'
          )

          old = 'Status: **active — PR #232 / Migration Bridge 0.8.58 candidate / current development pointer**'
          new = 'Status: **accepted — PR #232 / 13 of 13 CI gates green / merge `d1c81cc57ef641dc00d07c10e2bcc7111cdb064a` / Migration Bridge 0.8.58**'
          if old not in text:
              raise SystemExit('10E.4E.3 status marker missing')
          text = text.replace(old, new)

          old_final = '''#### 10E.4E.final — Clean-site acceptance\n\nStatus: **planned**\n\nValidate:\n'''
          new_final = '''#### 10E.4E.final — Clean-site acceptance\n\nStatus: **active — current execution pointer / functional development frozen at Migration Bridge 0.8.58**\n\nDevelopment freeze evidence:\n\n- PR #232 accepted and merged as `d1c81cc57ef641dc00d07c10e2bcc7111cdb064a`;\n- all 13 repository gates passed on the exact 0.8.58 head;\n- WPCS and PHPStan level 6 green;\n- WordPress Smoke green on WordPress 7.1 / PHP 8.2;\n- Theme, multilingual, accessibility/responsive and Lighthouse performance gates green;\n- deterministic Migration Bridge 0.8.58 release and EMMAKE field-pilot pack green;\n- no automatic production cutover exists.\n\nExecution order for `/nuevaweb/`:\n\n1. install/verify the accepted SEO/GEO Theme + Migration Bridge 0.8.58 artifacts;\n2. run Rescue Manifest + Clone Reset + Corporate bootstrap;\n3. complete Home pipeline;\n4. complete Services, Work, About and Contact through the generic page pipeline;\n5. assign and validate native dynamic Insights;\n6. require `CorporateSiteReadiness` global machine gate green;\n7. execute page-by-page and whole-site browser QA;\n8. record defects and fix only evidence-backed failures;\n9. production cutover remains a separate explicit decision.\n\nValidate:\n'''
          if old_final not in text:
              raise SystemExit('10E.4E.final marker missing')
          text = text.replace(old_final, new_final)

          text = text.replace(
              '- deploy the accepted field-pilot pack to `emmake.com/nuevaweb/`;\n- verify its outer SHA-256;\n- execute the bundled runbook;\n- require Step 7 `ready_for_browser_qa=true`;\n- fill the five browser QA evidence fields;\n- only then decide whether Home cutover is eligible for explicit approval.',
              '- superseded as the global execution pointer by **10E.4E.final complete-site sandbox acceptance**;\n- the deterministic Home pack remains valid input/evidence for the Home portion of the complete-site test;\n- no Home-only cutover decision is taken before the whole-site readiness and browser QA sequence is complete.'
          )

          path.write_text(text)
          PY

      - name: Commit roadmap closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md
          git commit -m 'Close 10E.4E.3 and advance complete-site testing'
          git push origin HEAD:docs/close-10e4e3-testing-pointer
