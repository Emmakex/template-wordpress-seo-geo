name: SEO GEO Manager Operation Evidence Workspace

on:
  pull_request:
    paths:
      - 'packages/seo-geo-manager/**'
      - 'scripts/ci/seo-geo-manager-operation-evidence-workspace-contract.php'
      - '.github/workflows/seo-geo-manager-operation-evidence-workspace.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/seo-geo-manager/**'
      - 'scripts/ci/seo-geo-manager-operation-evidence-workspace-contract.php'
      - '.github/workflows/seo-geo-manager-operation-evidence-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-geo-manager-operation-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operation-evidence-workspace:
    name: Privacy-bounded operation evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runtime versions
        run: |
          php --version | head -n 1
          node --version

      - name: Syntax
        run: |
          php -l packages/seo-geo-manager/src/Admin/OperationHistory.php
          php -l packages/seo-geo-manager/src/Rest/OperationHistoryController.php
          php -l packages/seo-geo-manager/src/Changes/OperationStore.php
          php -l packages/seo-geo-manager/seo-geo-manager.php
          php -l scripts/ci/seo-geo-manager-operation-evidence-workspace-contract.php
          node --check packages/seo-geo-manager/assets/admin/operation-history.js

      - name: Operation Evidence Workspace contract
        run: php scripts/ci/seo-geo-manager-operation-evidence-workspace-contract.php
