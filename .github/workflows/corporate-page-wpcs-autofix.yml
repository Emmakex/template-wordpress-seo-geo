name: Corporate Page WPCS Autofix

on:
  push:
    branches:
      - feat/corporate-inner-page-content-pipeline

permissions:
  contents: write

concurrency:
  group: corporate-page-wpcs-autofix
  cancel-in-progress: false

jobs:
  autofix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/corporate-inner-page-content-pipeline

      - name: PHP 8.2 toolchain
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install pinned quality dependencies
        run: bash scripts/ci/php-quality.sh deps

      - name: Apply PHPCBF-safe formatting fixes
        run: |
          vendor/bin/phpcbf --standard=phpcs.xml.dist \
            packages/seo-geo-migration-bridge/src/Reset/AdminCorporatePagePipelineController.php \
            packages/seo-geo-migration-bridge/src/Reset/AdminCorporateInsightsController.php \
            packages/seo-geo-migration-bridge/src/Reset/AdminCorporateSiteReadinessController.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporatePageContentKit.php \
            packages/seo-geo-migration-bridge/src/Reset/NativeCorporatePageHydrator.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporatePageSeoHandoff.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporatePageReadiness.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporateInsightsManager.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporateSiteReadiness.php \
            packages/seo-geo-theme/inc/Insights/InsightsIndexRuntime.php \
            packages/seo-geo-theme/functions.php \
            packages/seo-geo-theme/patterns/author-profile.php \
            packages/seo-geo-theme/patterns/contact.php || true

      - name: Commit safe formatting fixes
        run: |
          if git diff --quiet; then
            echo 'No auto-fixable WPCS changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/seo-geo-migration-bridge packages/seo-geo-theme
          git commit -m 'Apply WPCS-safe Corporate page formatting fixes'
          git push origin HEAD:feat/corporate-inner-page-content-pipeline
