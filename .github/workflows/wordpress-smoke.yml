name: WordPress Smoke CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/ci/wordpress-smoke.sh'
      - 'scripts/ci/migration-bridge-site-analyzer-acceptance.sh'
      - 'scripts/ci/migration-bridge-baseline-acceptance.sh'
      - 'scripts/ci/migration-bridge-dependency-graph-acceptance.sh'
      - 'scripts/ci/migration-bridge-sandbox-lab-acceptance.sh'
      - 'scripts/ci/migration-bridge-migration-engine-acceptance.sh'
      - 'scripts/ci/migration-bridge-parity-acceptance.sh'
      - 'scripts/ci/migration-bridge-cutover-acceptance.sh'
      - 'scripts/ci/migration-bridge-report-acceptance.sh'
      - 'scripts/ci/migration-bridge-portable-clone-local-plan-acceptance.sh'
      - 'scripts/ci/migration-bridge-portable-clone-local-bootstrap-acceptance.sh'
      - 'scripts/ci/migration-bridge-portable-clone-local-runtime-acceptance.sh'
      - 'scripts/ci/migration-bridge-operator-ui-acceptance.sh'
      - '.github/workflows/wordpress-smoke.yml'
      - 'docs/COMPATIBILITY.md'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/ci/wordpress-smoke.sh'
      - 'scripts/ci/migration-bridge-site-analyzer-acceptance.sh'
      - 'scripts/ci/migration-bridge-baseline-acceptance.sh'
      - 'scripts/ci/migration-bridge-dependency-graph-acceptance.sh'
      - 'scripts/ci/migration-bridge-sandbox-lab-acceptance.sh'
      - 'scripts/ci/migration-bridge-migration-engine-acceptance.sh'
      - 'scripts/ci/migration-bridge-parity-acceptance.sh'
      - 'scripts/ci/migration-bridge-cutover-acceptance.sh'
      - 'scripts/ci/migration-bridge-report-acceptance.sh'
      - 'scripts/ci/migration-bridge-portable-clone-local-plan-acceptance.sh'
      - 'scripts/ci/migration-bridge-portable-clone-local-bootstrap-acceptance.sh'
      - 'scripts/ci/migration-bridge-portable-clone-local-runtime-acceptance.sh'
      - 'scripts/ci/migration-bridge-operator-ui-acceptance.sh'
      - '.github/workflows/wordpress-smoke.yml'
      - 'docs/COMPATIBILITY.md'

permissions:
  contents: read

concurrency:
  group: wordpress-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-smoke:
    name: WordPress activation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker runtime
        run: docker version

      - name: Validate smoke script syntax
        run: bash -n scripts/ci/wordpress-smoke.sh scripts/ci/migration-bridge-site-analyzer-acceptance.sh scripts/ci/migration-bridge-baseline-acceptance.sh scripts/ci/migration-bridge-dependency-graph-acceptance.sh scripts/ci/migration-bridge-sandbox-lab-acceptance.sh scripts/ci/migration-bridge-migration-engine-acceptance.sh scripts/ci/migration-bridge-parity-acceptance.sh scripts/ci/migration-bridge-cutover-acceptance.sh scripts/ci/migration-bridge-report-acceptance.sh scripts/ci/migration-bridge-portable-clone-local-plan-acceptance.sh scripts/ci/migration-bridge-portable-clone-local-bootstrap-acceptance.sh scripts/ci/migration-bridge-portable-clone-local-runtime-acceptance.sh scripts/ci/migration-bridge-operator-ui-acceptance.sh

      - name: WordPress 7.1 / PHP 8.2 activation smoke
        run: bash scripts/ci/wordpress-smoke.sh
