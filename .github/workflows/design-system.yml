name: Design System CI

on:
  pull_request:
    paths:
      - 'packages/seo-geo-theme/theme.json'
      - 'packages/seo-geo-theme/assets/css/design-system.css'
      - 'packages/seo-geo-theme/assets/css/presets/*.css'
      - 'packages/seo-geo-theme/functions.php'
      - 'scripts/ci/validate-design-system.php'
      - 'scripts/ci/php-lint-diagnostic.sh'
      - '.github/workflows/design-system.yml'
      - 'docs/DESIGN_SYSTEM.md'
      - 'docs/DESIGN_BENCHMARK_2026.md'
      - 'docs/DESIGN_SYSTEM_ROADMAP_1_0.md'
  push:
    branches:
      - main
    paths:
      - 'packages/seo-geo-theme/theme.json'
      - 'packages/seo-geo-theme/assets/css/design-system.css'
      - 'packages/seo-geo-theme/assets/css/presets/*.css'
      - 'packages/seo-geo-theme/functions.php'
      - 'scripts/ci/validate-design-system.php'
      - 'scripts/ci/php-lint-diagnostic.sh'
      - '.github/workflows/design-system.yml'
      - 'docs/DESIGN_SYSTEM.md'
      - 'docs/DESIGN_BENCHMARK_2026.md'
      - 'docs/DESIGN_SYSTEM_ROADMAP_1_0.md'

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system:
    name: Theme token contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate diagnostic wrapper syntax
        run: bash -n scripts/ci/php-lint-diagnostic.sh

      - name: Validate design-system script syntax
        run: bash scripts/ci/php-lint-diagnostic.sh scripts/ci/validate-design-system.php

      - name: Validate semantic tokens and contrast
        run: php scripts/ci/validate-design-system.php
