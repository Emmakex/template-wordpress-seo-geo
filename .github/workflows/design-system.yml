name: Design System CI

on:
  pull_request:
    paths:
      - 'packages/seo-geo-theme/theme.json'
      - 'packages/seo-geo-theme/functions.php'
      - 'packages/seo-geo-theme/inc/setup.php'
      - 'packages/seo-geo-theme/inc/strategic.php'
      - 'packages/seo-geo-theme/inc/Strategic/**'
      - 'packages/seo-geo-theme/strategic-templates/**'
      - 'packages/seo-geo-theme/assets/css/presets/corporate-v2.css'
      - 'packages/seo-geo-theme/assets/css/presets/corporate-v5-runtime.css'
      - 'presets/corporate/content-map.json'
      - 'scripts/ci/validate-design-system.php'
      - 'scripts/ci/corporate-v3-visual-contract.sh'
      - 'scripts/ci/php-lint-diagnostic.sh'
      - '.github/workflows/design-system.yml'
      - 'docs/DESIGN_SYSTEM.md'
  push:
    branches:
      - main
    paths:
      - 'packages/seo-geo-theme/theme.json'
      - 'packages/seo-geo-theme/functions.php'
      - 'packages/seo-geo-theme/inc/setup.php'
      - 'packages/seo-geo-theme/inc/strategic.php'
      - 'packages/seo-geo-theme/inc/Strategic/**'
      - 'packages/seo-geo-theme/strategic-templates/**'
      - 'packages/seo-geo-theme/assets/css/presets/corporate-v2.css'
      - 'packages/seo-geo-theme/assets/css/presets/corporate-v5-runtime.css'
      - 'presets/corporate/content-map.json'
      - 'scripts/ci/validate-design-system.php'
      - 'scripts/ci/corporate-v3-visual-contract.sh'
      - 'scripts/ci/php-lint-diagnostic.sh'
      - '.github/workflows/design-system.yml'
      - 'docs/DESIGN_SYSTEM.md'

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system:
    name: Theme token + Corporate v5 contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate diagnostic wrapper syntax
        run: bash -n scripts/ci/php-lint-diagnostic.sh

      - name: Validate design-system script syntax
        run: bash scripts/ci/php-lint-diagnostic.sh scripts/ci/validate-design-system.php

      - name: Validate semantic tokens and contrast
        run: php scripts/ci/validate-design-system.php

      - name: Validate Corporate v5 contract syntax
        run: bash -n scripts/ci/corporate-v3-visual-contract.sh

      - name: Validate Corporate v5 Theme-owned Home contract
        run: bash scripts/ci/corporate-v3-visual-contract.sh
