name: Corporate Page Final WPCS Fix

on:
  push:
    branches:
      - feat/corporate-inner-page-content-pipeline

permissions:
  contents: write

concurrency:
  group: corporate-page-final-wpcs-fix
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/corporate-inner-page-content-pipeline

      - name: PHP 8.2 toolchain
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install pinned quality dependencies
        run: bash scripts/ci/php-quality.sh deps

      - name: Fix WPCS/PHPStan-compatible collection docblocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('packages/seo-geo-migration-bridge/src/Reset/CorporatePageSeoHandoff.php'): [
                  (
                      '* @param list<string>        $review_items Review items accumulator.',
                      '* @param array               $review_items Review items accumulator.\n\t * @phpstan-param list<string> $review_items'
                  ),
                  (
                      '* @param list<string>        $keys Provider metadata keys.',
                      '* @param array               $keys Provider metadata keys.\n\t * @phpstan-param list<string> $keys'
                  ),
              ],
              Path('packages/seo-geo-migration-bridge/src/Reset/CorporateInsightsManager.php'): [
                  (
                      '* @param list<string>        $review_items Review items accumulator.',
                      '* @param array               $review_items Review items accumulator.\n\t * @phpstan-param list<string> $review_items'
                  ),
                  (
                      '* @param list<string>        $keys Provider metadata keys.',
                      '* @param array               $keys Provider metadata keys.\n\t * @phpstan-param list<string> $keys'
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected WPCS docblock fragment in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Apply PHPCBF-safe formatting
        run: |
          vendor/bin/phpcbf --standard=phpcs.xml.dist \
            packages/seo-geo-migration-bridge/src/Reset/CorporatePageSeoHandoff.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporateInsightsManager.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporateSiteReadiness.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporatePageContentKit.php || true

      - name: Verify WPCS
        run: |
          vendor/bin/phpcs --standard=phpcs.xml.dist \
            packages/seo-geo-migration-bridge/src/Reset/CorporatePageSeoHandoff.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporateInsightsManager.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporateSiteReadiness.php \
            packages/seo-geo-migration-bridge/src/Reset/CorporatePageContentKit.php

      - name: Commit final quality fixes
        run: |
          if git diff --quiet; then
            echo 'No final WPCS fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/seo-geo-migration-bridge/src/Reset
          git commit -m 'Finish Corporate page WPCS cleanup'
          git push origin HEAD:feat/corporate-inner-page-content-pipeline
