name: SEO GEO Manager WordPress CI

on:
  pull_request:
    paths:
      - 'packages/seo-geo-manager/**'
      - 'scripts/build-theme-package.sh'
      - 'scripts/ci/seo-geo-manager-wordpress-acceptance.sh'
      - 'scripts/ci/seo-geo-manager-wordpress-acceptance.php'
      - 'scripts/ci/seo-geo-manager-structured-acceptance.php'
      - 'scripts/ci/seo-geo-manager-seo-authority-acceptance.php'
      - 'scripts/ci/seo-geo-manager-permalink-acceptance.php'
      - 'scripts/ci/seo-geo-manager-redirect-runtime-acceptance.php'
      - 'scripts/ci/seo-geo-manager-atomic-redirect-acceptance.php'
      - 'scripts/ci/seo-geo-manager-operation-history-acceptance.php'
      - 'scripts/ci/seo-geo-manager-permalink-acceptance.sh'
      - '.github/workflows/seo-geo-manager-wordpress.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/seo-geo-manager/**'
      - 'scripts/build-theme-package.sh'
      - 'scripts/ci/seo-geo-manager-wordpress-acceptance.sh'
      - 'scripts/ci/seo-geo-manager-wordpress-acceptance.php'
      - 'scripts/ci/seo-geo-manager-structured-acceptance.php'
      - 'scripts/ci/seo-geo-manager-seo-authority-acceptance.php'
      - 'scripts/ci/seo-geo-manager-permalink-acceptance.php'
      - 'scripts/ci/seo-geo-manager-redirect-runtime-acceptance.php'
      - 'scripts/ci/seo-geo-manager-atomic-redirect-acceptance.php'
      - 'scripts/ci/seo-geo-manager-operation-history-acceptance.php'
      - 'scripts/ci/seo-geo-manager-permalink-acceptance.sh'
      - '.github/workflows/seo-geo-manager-wordpress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-geo-manager-wordpress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager-wordpress:
    name: M1/M2 + Theme + SEO authority + atomic runtime + history acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate acceptance scripts and dashboard JavaScript
        run: |
          bash -n scripts/ci/seo-geo-manager-wordpress-acceptance.sh
          bash -n scripts/ci/seo-geo-manager-permalink-acceptance.sh
          php -l scripts/ci/seo-geo-manager-wordpress-acceptance.php
          php -l scripts/ci/seo-geo-manager-structured-acceptance.php
          php -l scripts/ci/seo-geo-manager-seo-authority-acceptance.php
          php -l scripts/ci/seo-geo-manager-permalink-acceptance.php
          php -l scripts/ci/seo-geo-manager-redirect-runtime-acceptance.php
          php -l scripts/ci/seo-geo-manager-atomic-redirect-acceptance.php
          php -l scripts/ci/seo-geo-manager-operation-history-acceptance.php
          node --check packages/seo-geo-manager/assets/admin/dashboard.js
          node --check packages/seo-geo-manager/assets/admin/json-export-actions.js
          node --check packages/seo-geo-manager/assets/admin/correction-actions.js
          node --check packages/seo-geo-manager/assets/admin/permalink-actions.js
          node --check packages/seo-geo-manager/assets/admin/operation-history.js

      - name: Pull pinned WordPress fixture images
        run: |
          docker pull wordpress:7.1.0-php8.2-apache
          docker pull wordpress:cli-2.12.0-php8.2
          docker pull mariadb:11.8.9

      - name: Manager WordPress acceptance
        run: bash scripts/ci/seo-geo-manager-wordpress-acceptance.sh

      - name: Permalink authority, atomic redirect and operation history acceptance
        run: bash scripts/ci/seo-geo-manager-permalink-acceptance.sh
