name: Publisher Final Preset CI

on:
  pull_request:
    paths:
      - 'presets/publisher/**'
      - 'packages/seo-geo-theme/assets/css/design-system.css'
      - 'packages/seo-geo-theme/assets/css/presets/publisher.css'
      - 'packages/seo-geo-theme/preset-patterns/publisher-home-final.php'
      - 'packages/seo-geo-theme/preset-patterns/publisher-inner-final.php'
      - 'packages/seo-geo-theme/preset-templates/publisher-*.php'
      - 'packages/seo-geo-theme/inc/Publisher/FinalHomePattern.php'
      - 'packages/seo-geo-theme/inc/Templates/PresetTemplateRuntime.php'
      - 'packages/seo-geo-theme/functions.php'
      - 'scripts/ci/test-preset-template-runtime.php'
      - 'scripts/ci/validate-publisher-preset.php'
      - 'scripts/ci/validate-publisher-final-home.php'
      - 'scripts/ci/validate-publisher-final-inner.php'
      - 'scripts/ci/validate-publisher-final-system.php'
      - '.github/workflows/publisher-final-home.yml'
  push:
    branches:
      - main
    paths:
      - 'presets/publisher/**'
      - 'packages/seo-geo-theme/assets/css/design-system.css'
      - 'packages/seo-geo-theme/assets/css/presets/publisher.css'
      - 'packages/seo-geo-theme/preset-patterns/publisher-home-final.php'
      - 'packages/seo-geo-theme/preset-patterns/publisher-inner-final.php'
      - 'packages/seo-geo-theme/preset-templates/publisher-*.php'
      - 'packages/seo-geo-theme/inc/Publisher/FinalHomePattern.php'
      - 'packages/seo-geo-theme/inc/Templates/PresetTemplateRuntime.php'
      - 'packages/seo-geo-theme/functions.php'
      - 'scripts/ci/test-preset-template-runtime.php'
      - 'scripts/ci/validate-publisher-preset.php'
      - 'scripts/ci/validate-publisher-final-home.php'
      - 'scripts/ci/validate-publisher-final-inner.php'
      - 'scripts/ci/validate-publisher-final-system.php'
      - '.github/workflows/publisher-final-home.yml'

permissions:
  contents: read

concurrency:
  group: publisher-final-preset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Publisher final Home + inner + system contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        run: |
          php -l packages/seo-geo-theme/functions.php
          php -l packages/seo-geo-theme/inc/Publisher/FinalHomePattern.php
          php -l packages/seo-geo-theme/inc/Templates/PresetTemplateRuntime.php
          php -l packages/seo-geo-theme/preset-patterns/publisher-home-final.php
          php -l packages/seo-geo-theme/preset-patterns/publisher-inner-final.php
          php -l packages/seo-geo-theme/preset-templates/publisher-single.php
          php -l packages/seo-geo-theme/preset-templates/publisher-archive.php
          php -l packages/seo-geo-theme/preset-templates/publisher-404.php
          php -l scripts/ci/test-preset-template-runtime.php
          php -l scripts/ci/validate-publisher-preset.php
          php -l scripts/ci/validate-publisher-final-home.php
          php -l scripts/ci/validate-publisher-final-inner.php
          php -l scripts/ci/validate-publisher-final-system.php

      - name: Validate existing Publisher semantic contract
        run: php scripts/ci/validate-publisher-preset.php

      - name: Validate final Publisher Home contract
        run: php scripts/ci/validate-publisher-final-home.php

      - name: Validate final Publisher inner-page contract
        run: php scripts/ci/validate-publisher-final-inner.php

      - name: Validate preset template runtime isolation
        run: php scripts/ci/test-preset-template-runtime.php

      - name: Validate final Publisher system-surface contract
        run: php scripts/ci/validate-publisher-final-system.php
