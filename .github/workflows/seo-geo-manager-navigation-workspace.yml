name: SEO GEO Manager Navigation Workspace

on:
  pull_request:
    paths:
      - 'packages/seo-geo-manager/**'
      - 'scripts/ci/seo-geo-manager-navigation-workspace-contract.php'
      - '.github/workflows/seo-geo-manager-navigation-workspace.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/seo-geo-manager/**'
      - 'scripts/ci/seo-geo-manager-navigation-workspace-contract.php'
      - '.github/workflows/seo-geo-manager-navigation-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-geo-manager-navigation-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-workspace:
    name: Navigation target/resource and safe mutation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runtime versions
        run: |
          php --version | head -n 1
          node --version

      - name: Syntax
        run: |
          php -l packages/seo-geo-manager/src/Admin/NavigationWorkspace.php
          php -l packages/seo-geo-manager/src/Rest/NavigationChangeController.php
          php -l packages/seo-geo-manager/src/Changes/NavigationChangeAdapter.php
          php -l packages/seo-geo-manager/src/Plugin.php
          php -l packages/seo-geo-manager/seo-geo-manager.php
          php -l scripts/ci/seo-geo-manager-navigation-workspace-contract.php
          node --check packages/seo-geo-manager/assets/admin/navigation-workspace.js

      - name: Navigation Workspace contract
        run: php scripts/ci/seo-geo-manager-navigation-workspace-contract.php
