name: SEO GEO Manager Safe Recovery Workspace

on:
  pull_request:
    paths:
      - 'packages/seo-geo-manager/**'
      - 'scripts/ci/seo-geo-manager-safe-recovery-workspace-contract.php'
      - 'scripts/ci/seo-geo-manager-operation-history-acceptance.php'
      - '.github/workflows/seo-geo-manager-safe-recovery-workspace.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/seo-geo-manager/**'
      - 'scripts/ci/seo-geo-manager-safe-recovery-workspace-contract.php'
      - 'scripts/ci/seo-geo-manager-operation-history-acceptance.php'
      - '.github/workflows/seo-geo-manager-safe-recovery-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-geo-manager-safe-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-recovery-workspace:
    name: Type-specific recovery manifest contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runtime versions
        run: |
          php --version | head -n 1
          node --version

      - name: Syntax
        run: |
          php -l packages/seo-geo-manager/src/Admin/OperationHistory.php
          php -l packages/seo-geo-manager/src/Rest/OperationHistoryController.php
          php -l packages/seo-geo-manager/src/Support/OperationRecoveryRegistry.php
          php -l packages/seo-geo-manager/seo-geo-manager.php
          php -l scripts/ci/seo-geo-manager-safe-recovery-workspace-contract.php
          php -l scripts/ci/seo-geo-manager-operation-history-acceptance.php
          node --check packages/seo-geo-manager/assets/admin/operation-history.js
          node --check packages/seo-geo-manager/assets/admin/operation-recovery.js

      - name: Safe Recovery Workspace contract
        run: php scripts/ci/seo-geo-manager-safe-recovery-workspace-contract.php
