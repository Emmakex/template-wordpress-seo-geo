name: Phase 1 Package CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'presets/research/**'
      - 'scripts/ci/validate-phase1.sh'
      - 'scripts/ci/validate-research-person-identity.php'
      - '.github/workflows/phase-1.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'presets/research/**'
      - 'scripts/ci/validate-phase1.sh'
      - 'scripts/ci/validate-research-person-identity.php'
      - '.github/workflows/phase-1.yml'

permissions:
  contents: read

concurrency:
  group: phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-contract:
    name: Package contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime versions
        run: php -v

      - name: Validate shell syntax
        run: bash -n scripts/ci/validate-phase1.sh

      - name: Validate Phase 1 package contract
        run: bash scripts/ci/validate-phase1.sh

      - name: Validate Research Person identity contract
        run: php scripts/ci/validate-research-person-identity.php
